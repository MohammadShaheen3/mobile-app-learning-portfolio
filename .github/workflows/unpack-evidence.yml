name: Unpack screenshot evidence

on:
  push:
    paths:
      - 'evidence-module*.b64'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack evidence
        shell: bash
        run: |
          shopt -s nullglob
          for f in evidence-module*.b64; do
            zipfile="${f%.b64}.zip"
            base64 -d "$f" > "$zipfile"
            unzip -o "$zipfile" -d .
            rm -f "$f" "$zipfile"
          done
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module-1/Screenshots Module-2/Screenshots Module-3/Screenshots Module-4/Screenshots
          git add -u
          git diff --cached --quiet || git commit -m "Add verified Android module screenshot evidence"
          git push
